services:
  n8n:
    build: .
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_COMMUNITY_PACKAGES_ENABLED: "true"
      N8N_EDITOR_BASE_URL: http://157.90.171.204:5678
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
