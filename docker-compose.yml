services:
  n8n:
    build: .
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_PROTOCOL: https
      N8N_HOST: n8n.hirekal.com
      N8N_EDITOR_BASE_URL: https://n8n.hirekal.com
      N8N_WEBHOOK_URL: https://n8n.hirekal.com/
      N8N_PROXY_HOPS: 1
      N8N_COMMUNITY_PACKAGES_ENABLED: "true"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
